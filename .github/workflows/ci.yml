name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check lint and formatting
        run: |
          ruff check .
          ruff format --check .

  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: awe_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d awe_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:ci-postgres-password@127.0.0.1:5432/awe_ci
      DEBUG: "false"
      ADMIN_API_TOKEN: ci-test-admin-token
      JWT_SECRET_KEY: ci-test-jwt-signing-secret-at-least-64-characters-long-for-tests-only
      FERNET_KEY: M45nVuyacaWC9tH42QO84rlv9EZInG6LJ9eVIoSDv_g=
      YOOKASSA_SHOP_ID: ""
      YOOKASSA_SECRET_KEY: ""
      SMTP_USER: ""
      SMTP_PASSWORD: ""
      TELEGRAM_BOT_TOKEN: ""
      TELEGRAM_ADMIN_CHAT_ID: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install API collection runners
        run: npm install --global newman@6.2.3 @usebruno/cli@4.3.0
      - name: Apply migrations
        run: python -m alembic upgrade head
      - name: Run tests
        run: pytest tests/

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build image
        run: docker build --pull --tag awe:ci .

  required:
    name: CI required
    needs: [lint, tests, docker]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      LINT_RESULT: ${{ needs.lint.result }}
      TESTS_RESULT: ${{ needs.tests.result }}
      DOCKER_RESULT: ${{ needs.docker.result }}
    steps:
      - name: Require successful checks
        run: |
          test "$LINT_RESULT" = success
          test "$TESTS_RESULT" = success
          test "$DOCKER_RESULT" = success
